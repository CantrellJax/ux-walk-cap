<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect a device · Cap UX</title><link rel="stylesheet" href="/style.css"><script type="module" src="/device.js"></script></head>
<body><main class="account"><a class="brand" href="/"><img src="/icon.png" alt="" width="40" height="40"><span>Cap UX</span></a><h1>Connect Cap UX</h1><p id="status" role="status">Enter the code shown in Cap UX.</p><section><form id="lookup"><label for="code">Device code</label><input id="code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required><button class="button" type="submit">Continue</button></form><div id="review" hidden><p id="request"></p><button type="button" class="button" id="approve">Approve</button><button type="button" class="button secondary" id="deny">Deny</button></div></section><footer>Only approve a code you started yourself in the Cap UX app or CLI.</footer></main></body></html>
