<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account · Cap UX</title><link rel="stylesheet" href="/style.css"><script type="module" src="/account.js"></script></head>
<body><main class="account"><a class="brand" href="/"><img src="/icon.png" alt="" width="40" height="40"><span>Cap UX</span></a><h1>Your account</h1><p id="status" role="status">Loading your account…</p><section><h2>Usage</h2><p id="identity"></p><p id="usage"></p></section><section><h2>Passkeys</h2><p>Add a passkey to sign in without GitHub or Google.</p><button type="button" class="button" id="passkey">Add a passkey</button></section><section><h2>Your data</h2><p>Download your share details, or delete your account and every recording you shared through it. Deletion cannot be undone; local recordings on your computer are not affected.</p><button type="button" class="button" id="export">Export account data</button><button type="button" class="button secondary" id="signout">Sign out</button><form id="delete"><label for="confirm">Type DELETE to confirm</label><input id="confirm" autocomplete="off" required><button class="button danger" type="submit">Delete account</button></form></section></main></body></html>
