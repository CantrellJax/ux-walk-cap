name: ux-walk native checks

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Build an isolated macOS preview after checks pass
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/desktop-gpui/**
      - apps/cli/**
      - scripts/bundle-gpui*
      - scripts/build-desktop-binaries*
      - scripts/build-macos-packages*
      - scripts/bundle-ux-walk.mjs
      - vendor/ux-walk/**
      - scripts/sync-ux-walk.mjs
      - .github/workflows/ux-walk-*.yml
  push:
    branches: [main, feat/walkthrough-entry]
    paths:
      - apps/desktop-gpui/**
      - apps/cli/**
      - scripts/bundle-gpui*
      - scripts/build-desktop-binaries*
      - scripts/build-macos-packages*

permissions:
  contents: read

concurrency:
  group: ux-walk-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'CantrellJax/ux-walk-cap'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check packaging profiles and staging
        run: node --test scripts/bundle-gpui.test.mjs scripts/build-desktop-binaries-cache.test.mjs scripts/build-macos-packages.test.mjs
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cap-ux-xcode26
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop-gpui -> target
      - name: Format changed Rust surfaces
        run: |
          rustfmt +1.95.0 --edition 2024 apps/desktop-gpui/src/tray.rs apps/desktop-gpui/src/updates.rs apps/desktop-gpui/src/installer.rs apps/desktop-gpui/src/ux_walk.rs apps/desktop-gpui/src/ux_walk_journal.rs apps/desktop-gpui/src/ux_walk_window.rs apps/desktop-gpui/src/session.rs apps/desktop-gpui/src/controls_window.rs apps/desktop-gpui/src/recording.rs apps/desktop-gpui/src/deeplink.rs apps/desktop-gpui/src/menus.rs apps/desktop-gpui/tests/ux_walk_journal_contract.rs apps/desktop-gpui/src/ux_walk_preferences.rs apps/desktop-gpui/src/settings_ux_walk.rs apps/desktop-gpui/src/settings_window.rs apps/desktop-gpui/src/settings_pages.rs apps/desktop-gpui/src/store.rs apps/desktop-gpui/src/diagnostics.rs apps/desktop-gpui/src/transcription.rs apps/desktop-gpui/src/mode_choice.rs apps/desktop-gpui/src/mode_select_window.rs apps/desktop-gpui/src/main_window.rs apps/desktop-gpui/src/onboarding_window.rs apps/desktop-gpui/src/onboarding_doodles.rs apps/desktop-gpui/src/app_windows.rs apps/cli/src/credentials.rs apps/cli/src/automation.rs apps/cli/src/recordings.rs apps/cli/src/update.rs
          git diff > "$RUNNER_TEMP/rustfmt.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustfmt-corrections
          path: ${{ runner.temp }}/rustfmt.patch
      - name: Prepare native dependencies
        run: |
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Check desktop and CLI
        run: |
          cargo +1.95.0 check --manifest-path apps/desktop-gpui/Cargo.toml --locked -p cap-desktop-gpui
          cargo +1.95.0 check --locked -p cap
      - name: Exercise the native walk processor
        run: node --test apps/desktop-gpui/ux-walk/native-walk.test.mjs
      - name: Exercise menu and fork update protection
        run: |
          task_frameworks="apps/desktop-gpui/target/debug/Frameworks"
          mkdir -p "$task_frameworks"
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$task_frameworks/Spacedrive.framework"
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui tray::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --test ux_walk_journal_contract
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk_preferences::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui main_window::mode_hover_tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui onboarding_window::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui installer::tests::fork_refuses_official_update_resolution
          cargo +1.95.0 test --locked -p cap update::tests::fork_refuses_official_installer
      - name: Verify formatting
        if: always()
        run: git diff --exit-code
      - name: Set up preview packaging tools
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install only the existing bundler's tools
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          task_tools="$RUNNER_TEMP/ux-walk-packaging-tools"
          mkdir -p "$task_tools"
          cd "$task_tools"
          printf '{"private":true}\n' > package.json
          bun add --exact @tauri-apps/cli@2.8.4 dotenv-cli@11.0.0
          printf '%s\n' "$task_tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare an isolated preview configuration
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ux-walk-preview'
          out.mkdir(parents=True, exist_ok=True)
          sha = os.environ['GITHUB_SHA']
          profile = '/tmp/ux-walk-cap-preview-' + sha[:12]
          info = plistlib.loads((root / 'apps/desktop-gpui/Info.plist').read_bytes())
          info['CFBundleDocumentTypes'] = []
          info['CFBundleURLTypes'] = []
          info['UXWalkBuildSHA'] = sha
          info['UXWalkSourceURL'] = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/tree/' + sha
          info['LSEnvironment'] = {
              'CAP_GPUI_APP_DATA_DIR': profile + '/data',
              'CAP_GPUI_LOG_DIR': profile + '/logs',
              'CAP_GPUI_RECORDINGS_DIR': profile + '/recordings',
              'CAP_UX_WALK_CONFIG_DIR': profile + '/ux-walk',
          }
          plist = out / 'Preview.plist'
          plist.write_bytes(plistlib.dumps(info))
          (root / 'apps/desktop-gpui/Info.plist').write_bytes(plist.read_bytes())
          config = {
              'productName': 'Cap UX Preview',
              'mainBinaryName': 'Cap',
              'identifier': 'com.cantrell.cap-ux.preview',
              'bundle': {
                  'createUpdaterArtifacts': False,
                  'fileAssociations': [],
                  'macOS': {'signingIdentity': '-', 'minimumSystemVersion': '15.0'},
              },
          }
          (out / 'preview.json').write_text(json.dumps(config, indent=2) + '\n')
          (out / 'source.json').write_text(json.dumps({
              'sourceRevision': sha, 'sourceURL': info['UXWalkSourceURL'],
              'profile': 'debug', 'isolatedProfile': profile,
              'purpose': 'local menu validation; not a signed public release',
          }, indent=2) + '\n')
          PY
      - name: Build a genuine debug preview through the existing pipeline
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: |
          task_target="$(rustc -vV | sed -n 's/host: //p')"
          node scripts/build-desktop-binaries.mjs "$task_target" --debug
          node scripts/bundle-gpui.mjs "$task_target" --debug --bundles app --config "$RUNNER_TEMP/ux-walk-preview/preview.json"
      - name: Bundle the pinned UX Walk engine and native controls
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          npm ci --ignore-scripts --prefix vendor/ux-walk
          node --test vendor/ux-walk/test/unit/embedded-config.test.mjs vendor/ux-walk/test/unit/start-link.test.mjs vendor/ux-walk/test/unit/cap-editor-handoff.test.mjs
          node scripts/bundle-ux-walk.mjs 'apps/desktop-gpui/target/debug/bundle/macos/Cap UX Preview.app'
      - name: Verify and retain the preview
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          task_app='apps/desktop-gpui/target/debug/bundle/macos/Cap UX Preview.app'
          test -d "$task_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$task_app/Contents/Info.plist")" = com.cantrell.cap-ux.preview
          test "$(/usr/libexec/PlistBuddy -c 'Print :UXWalkBuildSHA' "$task_app/Contents/Info.plist")" = "$GITHUB_SHA"
          codesign --verify --deep --strict "$task_app"
          python3 - <<'PY'
          import os, pathlib, plistlib
          app = pathlib.Path('apps/desktop-gpui/target/debug/bundle/macos/Cap UX Preview.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          profile = '/tmp/ux-walk-cap-preview-' + os.environ['GITHUB_SHA'][:12]
          assert not info.get('CFBundleDocumentTypes'), 'Preview must not claim recordings'
          assert not info.get('CFBundleURLTypes'), 'Preview must not claim URL schemes'
          assert info['LSMinimumSystemVersion'] == '15.0', 'Cap UX requires macOS 15'
          assert info['LSEnvironment'] == {
              'CAP_GPUI_APP_DATA_DIR': profile + '/data',
              'CAP_GPUI_LOG_DIR': profile + '/logs',
              'CAP_GPUI_RECORDINGS_DIR': profile + '/recordings',
              'CAP_UX_WALK_CONFIG_DIR': profile + '/ux-walk',
          }, 'Preview profile isolation was not retained by the bundler'
          print('Bundled preview associations and isolated profile verified')
          PY
          file "$task_app/Contents/MacOS/Cap" > "$RUNNER_TEMP/ux-walk-preview/executable.txt"
          ditto -c -k --sequesterRsrc --keepParent "$task_app" "$RUNNER_TEMP/ux-walk-preview/Cap-UX-Preview.zip"
          cp LICENSE UX-WALK.md "$RUNNER_TEMP/ux-walk-preview/"
          shasum -a 256 "$RUNNER_TEMP/ux-walk-preview/Cap-UX-Preview.zip" > "$RUNNER_TEMP/ux-walk-preview/SHA256.txt"
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        with:
          name: cap-walkthrough-preview
          path: ${{ runner.temp }}/ux-walk-preview/
          retention-days: 14
